allprojects {
    afterEvaluate { project ->
        if (project.name == 'mobile') {
            project.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.14.1')
            project.dependencies.add('testImplementation', 'io.mockk:mockk:1.13.16')
            project.dependencies.add('testImplementation', 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0')
            project.tasks.withType(Test).configureEach {
                systemProperty 'robolectric.logging.enabled', 'true'
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                systemProperty 'maven.repo.local', '/opt/android-closure/robolectric-maven'
                def jars = System.getenv('VPNHOTSPOT_ROBOLECTRIC_JARS')
                if (jars) {
                    systemProperty 'robolectric.offline', 'true'
                    systemProperty 'robolectric.dependency.dir', jars
                }
            }
        }
    }
}
