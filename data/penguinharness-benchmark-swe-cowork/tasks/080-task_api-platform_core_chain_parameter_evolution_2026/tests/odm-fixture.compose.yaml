services:
  mongo:
    image: ${TASK_MONGODB_IMAGE:?Set a verified digest-pinned mongo 7.0.16 image reference}
    command: [mongod, --bind_ip_all, --port, '27017', --wiredTigerCacheSizeGB, '0.25', --nounixsocket]
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    volumes:
      - ${TASK_ODM_DATA_DIR:?Set a new verifier-owned directory under /data2}:/data/db
    networks:
      default:
        aliases: [mongo]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: 'no'
networks:
  default:
    internal: true
