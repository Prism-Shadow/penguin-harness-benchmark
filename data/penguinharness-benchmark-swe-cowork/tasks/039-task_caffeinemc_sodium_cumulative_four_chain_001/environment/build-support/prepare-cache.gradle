allprojects {
    afterEvaluate { p ->
        if (p.path in [':common', ':fabric', ':neoforge']) {
            def natives = configurations.create('sodiumOfflineNatives')
            ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-jemalloc',
             'lwjgl-openal', 'lwjgl-tinyfd'].each { module ->
                dependencies.add(natives.name, "org.lwjgl:${module}:3.3.3:natives-linux")
            }
            tasks.register('prepareOfflineRuntime') {
                doLast {
                    sourceSets.main.runtimeClasspath.files.each { assert it.exists() }
                    natives.files.each { assert it.exists() }
                }
            }
        }
    }
}
