// Public source-built FFAPI replaces the inaccessible GitHub Packages artifacts.
allprojects {
    repositories {
        maven { url = uri('/opt/ffapi-maven') }
    }
    configurations.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group == 'org.sinytra.forgified-fabric-api') {
                def versions = [
                    'fabric-api-base': '0.4.48',
                    'fabric-renderer-api-v1': '4.0.3',
                    'fabric-rendering-data-attachment-v1': '0.3.54',
                    'fabric-block-view-api-v2': '1.0.16'
                ]
                if (versions.containsKey(requested.name)) {
                    useVersion(versions[requested.name] + '+repair.fb509f4d')
                    because('Public Minecraft 1.21.3 FFAPI source fb509f4d; see /opt/build-provenance.json')
                }
            }
        }
    }
}
